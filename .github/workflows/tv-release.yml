name: Shelby+ Remote TV Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed TV version (must match app/tvsetup/VERSION)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shelby-production-release
  cancel-in-progress: false
jobs:
  tv-web-server:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tv-pwa-server.yml
  release:
    if: github.ref == 'refs/heads/main'
    needs: tv-web-server
    environment: shelby-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      SHELBY_TV_KEYSTORE_BASE64: ${{ secrets.SHELBY_TV_KEYSTORE_BASE64 }}
      SHELBY_STORE_PASSWORD: ${{ secrets.SHELBY_STORE_PASSWORD }}
      SHELBY_KEY_PASSWORD: ${{ secrets.SHELBY_KEY_PASSWORD }}
      SHELBY_KEY_ALIAS: ${{ secrets.SHELBY_KEY_ALIAS }}
      SHELBY_RELEASE_CERT_SHA256: ${{ vars.SHELBY_RELEASE_CERT_SHA256 }}
      SHELBY_INITIAL_MIGRATION_APPROVED: ${{ vars.SHELBY_INITIAL_MIGRATION_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed version and refuse existing tags
        run: python3 dev/release/shelby_preflight.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check official TV branding
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 dev/gen/shelby_art.py --check
      - name: Signing policy checks
        run: python3 dev/release/test_shelby_signing.py
      - name: Web checks
        run: node --test app/shared/tests/*.test.js
      - name: Require and verify permanent signing configuration
        run: python3 dev/release/shelby_signing.py
      - name: Build existing signed TV APK
        run: app/tvsetup/build.sh
      - name: Kotlin tests and API lint
        working-directory: app/gradle
        run: ./gradlew --no-daemon :shared:testDebugUnitTest :tvsetup:testDebugUnitTest :shared:lintDebug :tvsetup:lintDebug
      - uses: actions/download-artifact@v4
        with:
          name: shelby-glass-review
          path: browser-review
      - name: Verify APKs and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribution
          cp app/tvsetup/build/tv-setup.apk distribution/shelby-plus-remote-tv.apk
          unzip -p distribution/shelby-plus-remote-tv.apk assets/tvkeys.apk > "$RUNNER_TEMP/tvkeys.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs distribution/shelby-plus-remote-tv.apk > distribution/SIGNING-CERTIFICATE.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/tvkeys.apk" > "$RUNNER_TEMP/addon-certificate.txt"
          gh release download "$PREVIOUS_TAG" --pattern SIGNING-CERTIFICATE.txt --output "$RUNNER_TEMP/previous-certificate.txt"
          gh release download "$PREVIOUS_TAG" --pattern APK-INFO.txt --output "$RUNNER_TEMP/previous-apk-info.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/shelby-plus-remote-tv.apk > distribution/APK-INFO.txt
          python3 dev/release/shelby_release.py
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('distribution/shelby-plus-remote-tv.apk') as apk:
              assert apk.read('assets/LICENSE') == Path('LICENSE').read_bytes()
          PYCODE
          cp browser-review/shelby-glass-chromium-390.png distribution/
          cp browser-review/shelby-glass-webkit-390.png distribution/
          cp browser-review/shelby-glass-webkit-keyboard.png distribution/
          cp browser-review/report.json distribution/GLASS-VALIDATION.json
          cp LICENSE distribution/LICENSE
          cp SIGNING.md distribution/SIGNING.md
          cp SHELBY.md distribution/INSTALL.md
          (cd distribution && sha256sum shelby-plus-remote-tv.apk > SHA256SUMS)
      - name: Publish complete GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          # Repeat public gates after the build; serialize production runs and never overwrite tags/assets.
          python3 dev/release/shelby_preflight.py
          cp .github/release-notes/shelby-tv.md "$RUNNER_TEMP/release-notes.md"
          printf '\nSigning mode for this release: **%s**.\n' "$SIGNING_MODE" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nAPK version: %s. Source commit: %s.\n' "$(cat app/tvsetup/VERSION)" "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nUpdate compatibility:\n\n' >> "$RUNNER_TEMP/release-notes.md"
          cat distribution/UPDATE-COMPATIBILITY.txt >> "$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Shelby+ Remote $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" distribution/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove private build keys
        if: always()
        run: rm -f "$RUNNER_TEMP/shelby-release.jks" "$RUNNER_TEMP/tvkeys.apk"
